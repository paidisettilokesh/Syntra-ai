version: '3.8'

services:
  mail_agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: mail_agent:latest
    container_name: mail_agent
    restart: unless-stopped
    ports:
      - "8080:8080"        # Dashboard web UI
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DASHBOARD_PORT=8080
      - FEATURE_ENABLE_DASHBOARD=true
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
